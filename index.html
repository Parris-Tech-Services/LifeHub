<body>
<div id="game-container">
  <h1>⚔ THE FELLOWSHIP'S LAST HOPE ⚔</h1>
  <div class="subtitle">— A Lord of the Rings Text Adventure —</div>
  <div id="stats-bar">
    <div class="stat"><span class="stat-label">HP:</span><span class="stat-hp" id="s-hp">100</span></div>
    <div class="stat"><span class="stat-label">Willpower:</span><span class="stat-will" id="s-will">10</span></div>
    <div class="stat"><span class="stat-label">Hope:</span><span class="stat-hope" id="s-hope">8</span></div>
    <div class="stat"><span class="stat-label">Ring Uses:</span><span class="stat-ring" id="s-ring">0</span></div>
  </div>
  <div id="chapter-label">Chapter I</div>
  <div id="story-box"></div>
  <div id="choices"></div>
  <button id="play-again" onclick="startGame()">▶ Play Again</button>
</div>

<script>
const state = { hp: 100, will: 10, hope: 8, ringUses: 0, chapter: 1, flags: {} };

function updateStats() {
  document.getElementById('s-hp').textContent = Math.max(0, state.hp);
  document.getElementById('s-will').textContent = state.will;
  document.getElementById('s-hope').textContent = state.hope;
  document.getElementById('s-ring').textContent = state.ringUses;
  document.getElementById('chapter-label').textContent = 'Chapter ' + toRoman(state.chapter);
}

function toRoman(n) {
  return ['I','II','III','IV','V','VI','VII','VIII','IX','X'][n-1] || n;
}

let typewriterTimeout = null;
function typeText(text, callback) {
  const box = document.getElementById('story-box');
  box.innerHTML = '';
  box.className = '';
  if (typewriterTimeout) clearTimeout(typewriterTimeout);
  let i = 0;
  const stripped = text.replace(/<[^>]+>/g, '');
  const tags = [];
  // Simple typewriter — render HTML instantly, animate only plain text length
  let raw = text;
  function step() {
    if (i < raw.length) {
      // Find next chunk (tag or char)
      if (raw[i] === '<') {
        let end = raw.indexOf('>', i);
        box.innerHTML = raw.substring(0, end + 1);
        i = end + 1;
        typewriterTimeout = setTimeout(step, 0);
      } else {
        i++;
        box.innerHTML = raw.substring(0, i);
        typewriterTimeout = setTimeout(step, 18);
      }
    } else {
      if (callback) callback();
    }
  }
  step();
}

function showChoices(choices) {
  const div = document.getElementById('choices');
  div.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.label;
    btn.onclick = () => {
      div.querySelectorAll('button').forEach(b => b.disabled = true);
      if (c.effect) c.effect();
      setTimeout(() => goTo(c.next), 300);
    };
    div.appendChild(btn);
  });
}

function goTo(sceneId) {
  state.chapter = scenes[sceneId].chapter || state.chapter;
  updateStats();
  const scene = scenes[sceneId];
  document.getElementById('play-again').style.display = 'none';
  document.getElementById('choices').innerHTML = '';
  typeText(scene.text, () => {
    if (scene.choices && scene.choices.length) {
      showChoices(scene.choices);
    } else {
      // ending
      document.getElementById('play-again').style.display = 'block';
    }
  });
}

  start: {
    chapter: 1,
    text: `The fires of Osgiliath have long since cooled, but the darkness pressing east from Mordor grows thicker with each passing hour. You are <span class="em">Aldric of Bree</span> — no king, no wizard — just a member of a hastily assembled Fellowship tasked with one impossible errand.

Gandalf places the Ring in your trembling hand. It is warm. It whispers.

<span class="em">"One of us must carry it,"</span> he says, grey eyes grave. <span class="em">"And it cannot be me."</span>

Aragorn's rangers have scouted two paths forward: the dark tunnels of Moria, or the long, exposed road through Rohan. Both are deadly. Neither forgives hesitation.

Outside, a Nazgûl's shriek tears the night sky apart.`,

      { label: '🐎  Ride through Rohan — long but open skies', next: 'rohan_entry' },

  },

  moria_entry: {
    chapter: 2,
    text: `The Doors of Durin are sealed by a riddle older than grief. By torchlight, you trace Elvish script above the arch: <span class="em">"Speak, friend, and enter."</span>

Gandalf laughs softly — the answer is simply the Elvish word for friend. The doors swing inward with a groan like a dying giant. Beyond: absolute dark, absolute silence, and something vast stirring in the deep.

Three days into the mountain, the Fellowship finds the tomb of Balin. Gimli weeps quietly. The dwarven ledger's last entry reads: <span class="em">"We cannot get out. The drums. The drums in the deep."</span>

HP -20 | Hope -1`,

  moria_fight: {

Willpower +2 | HP -10`,

You tear it free on the far side, gasping. Two Nazgûl, though miles away, turn their heads toward Moria like hunting hounds. They felt it. They always feel it.

Gandalf sacrifices himself at the bridge without your aid. The Fellowship grieves doubly — for him, and for what they glimpsed in your eyes.

Ring Uses +1 | Willpower -2 | Hope -2`,
    choices: [

Willpower -1 | Hope +3`,

      { label: '🗺  Press east — the Ents have bought time; head for Mordor\'s border', next: 'crossroads', effect: () => { state.will -= 1; state.hope += 3; state.flags.entAlliance = true; } },

const origChoices = [
  { label: '💀  March to the Black Gate with the Army of the Dead', next: 'dead_men', effect: () => {} },
  { label: '🕷  Take the secret stair of Cirith Ungol — speed over safety', next: 'cirith_ungol', effect: () => {} },
];
Object.defineProperty(scenes.crossroads, 'choices', {
  get() {
    const cs = [...origChoices];
    if (state.ringUses > 0 || state.will < 6) {
      cs.push({ label: '💍  Use the Ring to command safe passage — bend Middle-earth to your will', next: 'ring_corruption_end', effect: () => { state.ringUses += 1; } });
    }
    return cs;
  }
});

startGame();
</script>
