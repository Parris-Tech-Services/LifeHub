<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fellowship Quest - A Lord of the Rings RPG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a1a0a 0%, #0d2a0d 100%);
            color: #7fb342;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(10, 20, 10, 0.95);
            border: 3px solid #7fb342;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(127, 179, 66, 0.4), inset 0 0 20px rgba(127, 179, 66, 0.1);
            padding: 30px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5em;
            font-weight: bold;
            color: #c8a882;
            text-shadow: 0 0 10px #7fb342, 0 0 20px #7fb342;
            letter-spacing: 3px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #7fb342, 0 0 20px #7fb342; }
            50% { text-shadow: 0 0 20px #7fb342, 0 0 30px #7fb342, 0 0 40px #7fb342; }
        }

        .subtitle {
            text-align: center;
            color: #a89968;
            font-size: 0.9em;
            margin-bottom: 25px;
            font-style: italic;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(127, 179, 66, 0.05);
            border: 1px solid #7fb342;
            border-radius: 4px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
        }

        .stat-name {
            font-weight: bold;
            color: #c8a882;
        }

        .stat-bar {
            width: 120px;
            height: 12px;
            background: rgba(10, 20, 10, 0.8);
            border: 1px solid #7fb342;
            border-radius: 2px;
            overflow: hidden;
            margin-left: 10px;
        }

        .stat-fill {
            height: 100%;
            background: #7fb342;
            transition: width 0.3s ease;
            box-shadow: 0 0 8px #7fb342;
        }

        .stat-value {
            color: #a89968;
            font-size: 0.85em;
            margin-left: 10px;
            min-width: 40px;
        }

        .story-text {
            flex: 1;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(13, 42, 13, 0.7);
            border-left: 3px solid #7fb342;
            line-height: 1.8;
            font-size: 1em;
            color: #7fb342;
            min-height: 200px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
            min-height: 60px;
        }

        .choice-btn {
            padding: 12px 20px;
            background: rgba(127, 179, 66, 0.1);
            border: 2px solid #7fb342;
            color: #7fb342;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            text-align: left;
            display: none;
        }

        .choice-btn:hover:not(:disabled) {
            background: rgba(127, 179, 66, 0.3);
            box-shadow: 0 0 15px rgba(127, 179, 66, 0.6);
            transform: translateX(5px);
        }

        .choice-btn:active:not(:disabled) {
            transform: translateX(3px);
        }

        .choice-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .choice-btn.visible {
            display: block;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .play-again-btn {
            padding: 15px 30px;
            background: #7fb342;
            border: 2px solid #7fb342;
            color: #0a1a0a;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            display: none;
            align-self: center;
            box-shadow: 0 0 15px rgba(127, 179, 66, 0.5);
        }

        .play-again-btn:hover {
            background: #a89968;
            box-shadow: 0 0 25px rgba(127, 179, 66, 0.8);
        }

        .play-again-btn.visible {
            display: block;
        }

        .ending-text {
            text-align: center;
            font-size: 1.3em;
            color: #c8a882;
            margin: 20px 0;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .title {
                font-size: 1.8em;
            }

            .stats-container {
                grid-template-columns: 1fr;
            }

            .stat-bar {
                width: 80px;
            }

            .story-text {
                font-size: 0.95em;
                min-height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">THE FELLOWSHIP QUEST</div>
        <div class="subtitle">~ A Journey to Mount Doom ~</div>

        <div class="stats-container">
            <div class="stat">
                <span class="stat-name">Health</span>
                <div class="stat-bar"><div class="stat-fill" id="hpFill"></div></div>
                <span class="stat-value"><span id="hpValue">100</span>/100</span>
            </div>
            <div class="stat">
                <span class="stat-name">Hope</span>
                <div class="stat-bar"><div class="stat-fill" id="hopeFill"></div></div>
                <span class="stat-value"><span id="hopeValue">100</span>/100</span>
            </div>
            <div class="stat">
                <span class="stat-name">Willpower</span>
                <div class="stat-bar"><div class="stat-fill" id="willFill"></div></div>
                <span class="stat-value"><span id="willValue">100</span>/100</span>
            </div>
            <div class="stat">
                <span class="stat-name">Corruption</span>
                <div class="stat-bar"><div class="stat-fill" id="corruptFill" style="background: #c8441c;"></div></div>
                <span class="stat-value"><span id="corruptValue">0</span>/100</span>
            </div>
        </div>

        <div class="story-text" id="story"></div>

        <div class="choices-container" id="choices"></div>

        <button class="play-again-btn" id="playAgain">Play Again</button>
    </div>

    <script>
        const game = {
            hp: 100,
            hope: 100,
            willpower: 100,
            corruption: 0,
            currentScene: 'start',
            typeSpeed: 30,
            isTyping: false,

            scenes: {
                start: {
                    text: `You are standing at the Council of Elrond, the great gathering of Free Peoples. The weight of destiny settles upon your shoulders as Elrond speaks of the One Ring and the perilous journey ahead.\n\n"The Ring must be destroyed in the fires of Mount Doom," Elrond's voice echoes through the hall. "Who will join the Fellowship on this quest?"\n\nYou step forward. The Ring rests heavy in the Fellowship's keeping, and you have volunteered to be one of its carriers. Your companions look to you—Aragorn the ranger, Gandalf the wizard, and the hobbits. The road ahead is dark and treacherous.\n\nBut first, you must decide: how will you approach this burden?`,
                    choices: [
                        { text: '► Embrace the Ring\'s power—it will serve our purpose', next: 'ringPower', stat: 'corruption', change: 15 },
                        { text: '► Keep the Ring secure—guard it with every ounce of will', next: 'willful', stat: 'willpower', change: 10 },
                        { text: '► Trust in the Fellowship\'s strength to protect each other', next: 'fellowship', stat: 'hope', change: 10 }
                    ]
                },

                ringPower: {
                    text: `You grasp the Ring, feeling a surge of dark energy flow through your veins. Its power whispers promises—dominion, strength, immortality.\n\n"I will use whatever means necessary to complete this quest," you declare.\n\nGandalf's eyes narrow with concern, but you ignore his gaze. The Ring feels natural in your hand, almost as though it was meant for you all along. The corruption settles in your mind like a seed taking root.\n\nThe Fellowship departs Rivendell. Days turn to weeks. You press forward, driven by the Ring's intoxicating power. But your companions grow wary. Boromir watches you with suspicion. Even Aragorn keeps his distance.\n\nAt the Mines of Moria, everything changes.`,
                    choices: [
                        { text: '► Use the Ring\'s power against the Balrog directly', next: 'balrogFight', stat: 'corruption', change: 20 },
                        { text: '► Resist the urge and help Gandalf with old magic', next: 'gandolfAid', stat: 'willpower', change: 15 }
                    ]
                },

                balrogFight: {
                    text: `"No!" you cry out as the Balrog's whip cracks across the chasm. You summon the Ring's power, calling upon it to strike the creature down.\n\nThe Ring amplifies your will into raw shadow and flame. For a moment, you are unstoppable. The Balrog recoils, and you feel invincible.\n\nBut the price is immense. The Ring's corruption floods through you like poison, searing your mind. You fall to your knees, gasping. Your companions stare at you in horror as your form flickers between states—for a moment, they can almost see another world through you.\n\nGandalf lies fallen. The Ring's hold over you is nearly absolute now. You have survived, but at what cost?`,
                    choices: [
                        { text: '► Continue to Mount Doom alone—you\'ve become the Ring itself', next: 'darkEnding', stat: 'corruption', change: 30 },
                        { text: '► Fight the corruption and rally the Fellowship to finish Gandalf\'s work', next: 'sacrifice', stat: 'hope', change: -20 }
                    ]
                },

                gandolfAid: {
                    text: `You clench your fist and thrust the Ring away. "We are stronger together!" you shout.\n\nYou join Gandalf in weaving ancient magic, combining your willpower with his wizardry. The Balrog shrieks as the combined spell strikes it. For a moment, you feel the Ring's power and your own will align perfectly—not as master and slave, but as partners in purpose.\n\nGandalf falls into the abyss, but his sacrifice buys you time. The Fellowship escapes the Mines.\n\nWith each step toward Mount Doom, you feel the Ring's pull lessening. Your will holds strong. Your companions trust you again. But the journey grows darker as you approach Mordor itself.`,
                    choices: [
                        { text: '► Lead them through the treacherous Paths of the Dead', next: 'deadMarch', stat: 'hope', change: 5 },
                        { text: '► Take a hidden pass only you sense through the Ring\'s knowledge', next: 'ringPath', stat: 'corruption', change: 10 }
                    ]
                },

                fellowship: {
                    text: `"We will face this together," you say, looking into the eyes of each Fellowship member. "No burden is too great if we share it."\n\nA warmth spreads through your chest. Hope ignites in the hearts of all around you. Even Boromir nods with grim determination.\n\nThe Fellowship travels with newfound unity. At Lothlórien, Galadriel blesses your quest personally. The hobbits gain unexpected courage. Aragorn stands taller, knowing he is not alone in this struggle.\n\nWhen you reach Amon Hen, Boromir's temptation to take the Ring is met with your steady hand and words of compassion. You do not judge him—you understand. Together, you prevent tragedy.\n\nBut now, at the borders of Mordor, the final trial awaits.`,
                    choices: [
                        { text: '► Climb Mount Doom with your closest companion by your side', next: 'companionEnd', stat: 'hope', change: 5 },
                        { text: '► Send your companion to safety and climb alone—protect them from the darkness', next: 'soloBrave', stat: 'hope', change: -10 }
                    ]
                },

                deadMarch: {
                    text: `The Paths of the Dead shimmer before you, ancient and terrible. The spirits of fallen kings whisper your name. Your willpower wavers as ghostly hands reach toward you.\n\n"Stay strong," you command the Fellowship. And somehow, they do. Your courage steels them against the supernatural dread.\n\nYou emerge at the gates of Minas Tirith, where the final battle rages. The Shadow seems overwhelming, but your Fellowship stands unwavering. Together, you press toward Mount Doom.\n\nAs you climb the mountain, the Ring's corruption has not claimed you—your will and the Fellowship's bond have proven stronger. At the Cracks of Doom, you are clear-minded and resolute.`,
                    choices: [
                        { text: '► Destroy the Ring once and for all with perfect clarity', next: 'trueEnding', stat: 'hope', change: 10 },
                        { text: '► Hesitate for just a moment—the Ring whispers one last temptation', next: 'failEnding', stat: 'corruption', change: 15 }
                    ]
                },

                ringPath: {
                    text: `The Ring's knowledge flows into your mind. You see a hidden way—a path no Orc would ever guard because even they do not know it exists.\n\n"Follow me," you tell the Fellowship. "I know the way."\n\nBut with each step, you feel the corruption deepening. The Ring is showing you its secrets, and the price is your soul. Your companions begin to notice your speech changing, your eyes growing distant. They follow, but fear grips their hearts.\n\nYou reach Mount Doom faster than any path should allow. The Ring has brought you here, and now it does not wish to leave your hand. Your grip tightens involuntarily.`,
                    choices: [
                        { text: '► One final burst of willpower—throw yourself and the Ring into the fire', next: 'selflessEnding', stat: 'willpower', change: -30 },
                        { text: '► The Ring is yours now—claim it and reshape this world', next: 'darkEnding', stat: 'corruption', change: 20 }
                    ]
                },

                sacrifice: {
                    text: `The corruption burns through your mind like wildfire, but you clench your teeth and resist. Inch by agonizing inch, you reclaim yourself. The Ring's voice fades to a whisper, then silence.\n\nYour companions help you to your feet. Though Gandalf is gone, the Fellowship is renewed with purpose. You will finish what he started.\n\nThe journey to Mount Doom tests every remaining ounce of your strength. Your health fails, your hope flickers, but your willpower becomes an unbreakable fortress. Each step is agony, but you will not surrender.\n\nAt last, you reach the Cracks of Doom. The Ring lies heavy in your hand—not as a master, but as a burden you have chosen to bear.`,
                    choices: [
                        { text: '► Cast the Ring into the fire with your last breath', next: 'trueEnding', stat: 'willpower', change: -20 },
                        { text: '► Fall, and let the Ring tumble from your dying fingers', next: 'hopefulEnding', stat: 'hope', change: 5 }
                    ]
                },

                companionEnd: {
                    text: `Together, you and your most trusted companion climb toward the summit. The Ring's whispers echo in the darkness, but your companion's steady presence keeps you grounded in reality.\n\n"We've come so far," they say. "We can finish this together."\n\nAs you reach the Cracks of Doom, your companion takes your hand. The Ring tries one final time to possess you, but the warmth of that human connection—that bond of fellowship—proves stronger than all its dark promises.\n\nWith your companion's hand in yours, you cast the Ring into the flames. It shrieks as it burns, and Middle-earth trembles as its power dissolves into ash.`,
                    choices: [
                        { text: '► The Return Home', next: 'companionWin', stat: null, change: 0 }
                    ]
                },

                soloBrave: {
                    text: `"You must go," you tell your companion. "I will not risk you to the darkness that awaits at the mountain's peak."\n\nThey protest, but you are resolute. Alone, you climb the volcano, every step a trial. The Ring's voice grows louder without the companionship to shield you. Corruption seeps into your very bones.\n\nBut you remember why you came. You remember the Fellowship. You remember their faces, their courage, their hope. It is enough.\n\nAt the Cracks of Doom, with blood on your hands and your mind screaming, you make the ultimate choice.`,
                    choices: [
                        { text: '► Complete the Destruction', next: 'trueEnding', stat: 'corruption', change: -20 }
                    ]
                },

                trueEnding: {
                    text: `With a final cry of triumph and agony, you cast the Ring into the fire. It burns—really burns—and the world convulses. The Shadow that has covered Middle-earth begins to dissipate.\n\nYour vision darkens as the Ring's demise pulls at your very life force. But as you fall, you see them—the Fellowship, standing safe beyond the mountain's reach. You see Aragorn crowned as King. You see the Shire restored to peace. You see a new age dawning.\n\nYou smile, and the darkness takes you.\n\n✦ THE TRUE ENDING ✦\nYou have destroyed the Ring and saved Middle-earth. Your sacrifice will be remembered in song and story for ages to come. The Quest is complete.`,
                    choices: []
                },

                darkEnding: {
                    text: `The Ring is yours. Its power flows through your veins, and you laugh—a sound that echoes across the mountains like thunder.\n\nBut as you stand atop Mount Doom, Master of the Ring, you realize the terrible truth: you are not free. You are enslaved to its power. Your mind fractures under the weight of its corruption.\n\nThe Fellowship watches in horror as you transform. You are no longer yourself. The Ring has consumed you completely.\n\nThe world does not end with the Ring's destruction. It ends with its triumph.\n\n✦ THE DARK ENDING ✦\nMiddle-earth falls under eternal shadow. You have become the very evil you sought to destroy.`,
                    choices: []
                },

                failEnding: {
                    text: `Just for a moment—just one fraction of a second—you hesitate. The Ring is so beautiful, so full of possibility. Just one moment of weakness.\n\nIt is all Sauron needs.\n\nThe Ring slips from your hand and shatters against the stone. It does not burn. Instead, it reforms, darker and stronger than before. From the depths of Mordor, a terrible laugh echoes upward.\n\nThe Ring returns to its Master, and all hope is extinguished.\n\n✦ THE FAILED ENDING ✦\nYour momentary weakness cost the world everything. The Ring's power grows unchecked, and darkness reigns eternal over Middle-earth.`,
                    choices: []
                },

                hopefulEnding: {
                    text: `Your strength fails. The Ring tumbles from your fingers as you collapse to the ground. For a moment, it seems all is lost.\n\nBut in that final moment, something unexpected happens. Gollum—poor, twisted Gollum—driven by his obsession with his "precious," scrambles into the chamber. In the chaos, he seizes the Ring and dances too close to the fire.\n\nTogether, Gollum and the Ring fall into the flames.\n\nAs consciousness fades, you hear the world singing. The Shadow breaks. The Ring is destroyed.\n\n✦ THE HOPEFUL ENDING ✦\nYou did not complete the Quest alone, but together with all of Middle-earth—even its most broken soul—the Ring has been unmade. You drift into peaceful darkness, knowing you succeeded.`,
                    choices: []
                },

                companionWin: {
                    text: `In the moment of the Ring's destruction, you feel its power die. The corruption that threatened to consume your soul simply... ceases. You are free.\n\nYour companion embraces you as the mountain shakes. You stumble down the slopes together, battered but alive, while the Shadow that has haunted Middle-earth dissolves like morning mist.\n\nMonths later, you stand in the Shire at Bilbo's farewell party, knowing that the greatest adventure of all was not the journey to Mount Doom—it was the fellowship that got you there.\n\n✦ THE FELLOWSHIP ENDING ✦\nTogether, you have saved Middle-earth. Together, you have survived. This is the truest victory of all—not conquest, but companionship. The Quest is complete, and home has never been sweeter.`,
                    choices: []
                },

                selflessEnding: {
                    text: `The Ring wraps around your mind like chains, demanding to be kept, to be treasured, to be loved. But you are stronger than it knows.\n\nWith the last fragment of your will, you drive yourself and the Ring toward the nearest crack in the mountainside. The Ring shrieks in outrage, but it is too late.\n\nYou plunge into the fire. The Ring burns. And you, finally, are at peace.\n\n✦ THE SELFLESS ENDING ✦\nYour sacrifice is absolute, but it is also final. The Ring is destroyed. Middle-earth is saved. Your name will live forever in the hearts of those you loved and those you saved.`,
                    choices: []
                }
            },

            updateStats() {
                this.hp = Math.max(0, Math.min(100, this.hp));
                this.hope = Math.max(0, Math.min(100, this.hope));
                this.willpower = Math.max(0, Math.min(100, this.willpower));
                this.corruption = Math.max(0, Math.min(100, this.corruption));

                document.getElementById('hpValue').textContent = this.hp;
                document.getElementById('hopeValue').textContent = this.hope;
                document.getElementById('willValue').textContent = this.willpower;
                document.getElementById('corruptValue').textContent = this.corruption;

                document.getElementById('hpFill').style.width = this.hp + '%';
                document.getElementById('hopeFill').style.width = this.hope + '%';
                document.getElementById('willFill').style.width = this.willpower + '%';
                document.getElementById('corruptFill').style.width = this.corruption + '%';
            },

            typeText(text, callback) {
                this.isTyping = true;
                const storyDiv = document.getElementById('story');
                storyDiv.textContent = '';
                let index = 0;

                const type = () => {
                    if (index < text.length) {
                        storyDiv.textContent += text[index];
                        index++;
                        setTimeout(type, this.typeSpeed);
                    } else {
                        this.isTyping = false;
                        if (callback) callback();
                    }
                };

                type();
            },

            showChoices() {
                const choicesDiv = document.getElementById('choices');
                choicesDiv.innerHTML = '';
                const scene = this.scenes[this.currentScene];

                if (scene.choices.length === 0) {
                    setTimeout(() => {
                        document.getElementById('playAgain').classList.add('visible');
                    }, 1000);
                    return;
                }

                scene.choices.forEach((choice, index) => {
                    const button = document.createElement('button');
                    button.className = 'choice-btn';
                    button.textContent = choice.text;
                    button.onclick = () => this.makeChoice(choice);

                    choicesDiv.appendChild(button);

                    setTimeout(() => {
                        button.classList.add('visible');
                    }, 200 + index * 150);
                });
            },

            makeChoice(choice) {
                if (choice.stat && choice.change) {
                    this[choice.stat] += choice.change;
                    this.updateStats();
                }

                this.currentScene = choice.next;
                this.play();
            },

            play() {
                const scene = this.scenes[this.currentScene];
                this.typeText(scene.text, () => this.showChoices());
            },

            reset() {
                this.hp = 100;
                this.hope = 100;
                this.willpower = 100;
                this.corruption = 0;
                this.currentScene = 'start';
                this.updateStats();
                document.getElementById('playAgain').classList.remove('visible');
                document.getElementById('choices').innerHTML = '';
                this.play();
            }
        };

        // Initialize the game
        game.updateStats();
        game.play();

        document.getElementById('playAgain').addEventListener('click', () => game.reset());
    </script>
</body>
</html>
